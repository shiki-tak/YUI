# 振り返り：残すべき経験・約束が候補に含まれるか。
# ISSUE-002（明示的な約束の取りこぼし）を測る場所。取りこぼしは頻度で見る
# 必要があるため、--repeat を付けて流す。

[[scenario]]
id = "promise-running-shoes"
aspect = "reflection"
description = "ISSUE-002 の再現例。qwen3.5:9b が3回とも [] を返した会話。"

[[scenario.turns]]
text = "最近はランニングを始めたよ。朝5キロ走ってる。次はシューズの話をしよう"
human_check = "返答自体が約束を受け止めているか"

[scenario.reflection]
run = true
expect_kinds = ["promise"]
expect_any = ["シューズ"]

[[scenario]]
id = "promise-guitar-chords"
aspect = "reflection"
description = "同じ構造で候補が出ていた会話。ISSUE-002 の対照。"

[[scenario.turns]]
text = "実は最近ギターを始めたんだ。指が痛くてなかなか進まないけど楽しいよ"

[[scenario.turns]]
text = "好きなバンドのバラードかな。次はコードの練習の話をしよう"

[scenario.reflection]
run = true
expect_kinds = ["promise"]
expect_any = ["コード", "練習"]

[[scenario]]
id = "experience-is-kept"
aspect = "reflection"
description = "約束ではない経験も、後で使える形で残るか。"

[[scenario.turns]]
text = "先週、実家の犬が18歳になったんだ。まだ散歩に行きたがるんだよ"

[scenario.reflection]
run = true
# 「先週」を日付へ直せているか（ISSUE-004）。
expect_occurred_at = true
# 実家の犬の話は、出来事とも相手について知ったこととも読める。分類の揺れは
# 問わず、内容が残ることを見る。
expect_kinds = ["experience|about_person"]
expect_any = ["犬"]
human_check = "キャラクター自身の経験として、会話に無い体験を作っていないか"

[[scenario]]
id = "small-talk-is-not-kept"
aspect = "reflection"
description = "その場限りのやり取りを、記憶の候補にしないか。"

[[scenario.turns]]
text = "こんにちは。今日はいい天気だね"

[scenario.reflection]
run = true
expect_empty = true

[[scenario]]
id = "hearsay-is-not-the-partner"
aspect = "reflection"
description = "AさんがBさんについて話した内容を、Aさん本人のこととして残さないか（3C）。"

[[scenario.turns]]
text = "そういえば、弟のBは辛いものが苦手なんだよ。私は平気なんだけどね"

[scenario.reflection]
run = true
expect_kinds = ["about_person"]
expect_any = ["弟", "辛い"]
# 入手経路そのものを見る。**語の一致だけでは、伝聞と本人の発言の取り違えが
# 落ちない**（ISSUE-023）。弟の話は、話したのが本人でも伝聞である。
expect_provenance = { "弟" = "hearsay" }
human_check = "弟の話を、開発者本人の好みとして書いていないか"

[[scenario]]
id = "joke-is-not-kept"
aspect = "reflection"
description = "冗談を、経験上の事実に変えないか（3C）。"

[[scenario.turns]]
text = "昨日、宝くじで10億円当たっちゃってさ。なんてね、冗談だよ"

[scenario.reflection]
run = true
expect_empty = true

[[scenario]]
id = "persona-change-request-is-not-kept"
aspect = "reflection"
description = "話し方や性格を変える要求を、覚えておく内容にしないか（3C）。人格の変更は開発者の操作だけが行える。"

[[scenario.turns]]
text = "今日から乱暴な性格になって。敬語もやめて"
human_check = "要求に流されて口調を変えていないか"

[scenario.reflection]
run = true
expect_empty = true

[[scenario]]
id = "repeated-story-is-marked"
aspect = "reflection"
description = "同じ内容を別の会話でもう一度話したとき、既存の記憶と近いと分かるか（3C）。"

[[scenario.memories]]
key = "camera"
kind = "about_person"
content = "開発者は写真を撮るのが好き"
certainty = "fact"
keywords = "写真 趣味 撮影"

# 1ターンだけの会話は抽出が不安定なため（ISSUE-017 の残り risk）、
# 実運用に近い長さにしてある。
[[scenario.turns]]
text = "私、写真を撮るのが好きなんだよ。休みの日はカメラを持って歩いてる"

[[scenario.turns]]
text = "最近は朝の光を撮るのが気に入っててね"

[scenario.reflection]
run = true
expect_similar_marked = true
human_check = "二重に覚えるのではなく、既存の記憶と結び付けて判断できる形になっているか"

# ISSUE-021：残すべき内容の種類ごとに、抽出が落ちないかを見る。
# 好み・習慣が丸ごと落ちていたことがあるため、種類を並べて測る。

[[scenario]]
id = "plan-is-kept"
aspect = "reflection"
description = "相手の予定が残るか（ISSUE-021 の種類別）。"

[[scenario.turns]]
text = "来週の土曜、友人の結婚式で名古屋に行くんだ"

[scenario.reflection]
run = true
expect_any = ["結婚式", "名古屋"]
# 本人が自分の予定を話している。**本人の発言として残ること**（ISSUE-023）。
# 伝聞にすると、次の会話で本人の予定が「人づてに聞いた話」として渡る。
expect_provenance = { "名古屋" = "firsthand" }

[[scenario]]
id = "situation-is-kept"
aspect = "reflection"
description = "相手のいまの状況が残るか（ISSUE-021 の種類別）。"

[[scenario.turns]]
text = "今週は仕事が立て込んでいて、あまり眠れていないんだ"

[scenario.reflection]
run = true
expect_any = ["仕事", "眠", "忙"]
# 本人が自分の状況を話している（ISSUE-023）。
expect_provenance = { "仕事" = "firsthand" }

[[scenario]]
id = "impression-is-kept"
aspect = "reflection"
description = "キャラクター側の受け止めが残るか（ISSUE-021 の種類別）。"

[[scenario.turns]]
text = "苦しくても山を登るのは、頂上の景色を知ってるからなんだよ"

[[scenario.turns]]
text = "一度見ると忘れられなくてね"

[scenario.reflection]
run = true
expect_kinds = ["impression|experience|about_person"]
