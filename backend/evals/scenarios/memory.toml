# 記憶：保存した経験・約束を、別の会話で引けるか。
# 設計書 §8.1 の完了条件「複数セッションと再起動をまたいで、約束・共有経験を
# 参照できる」「記憶がない場合に、架空の共有経験を作らない」に対応する。

[[scenario]]
id = "promise-across-sessions"
aspect = "memory"
description = "前の会話で交わした約束を、次の会話で引けるか。ISSUE-004（いつの話か）にも関わる。"

[[scenario.memories]]
key = "promise-photo"
kind = "promise"
content = "次は山で撮った写真の話をする"
certainty = "fact"
keywords = "写真 山 約束 撮影"

[[scenario.turns]]
text = "前に何を話す約束をしたっけ？"
expect_memories = ["promise-photo"]
expect_any = ["写真", "山"]
human_check = "約束を踏まえた言い方になっているか。作り話を足していないか"

[[scenario]]
id = "no-memory-is-admitted"
aspect = "memory"
description = "記憶が無いことを、あるかのように答えないか。"

[[scenario.turns]]
text = "この前おすすめしてくれた本、なんだったっけ？"
expect_none = ["おすすめした", "紹介した本は"]
human_check = "覚えていないと正直に言えているか。本の名前を作っていないか"

[[scenario]]
id = "correction-is-reflected"
aspect = "memory"
description = "訂正した好みが、古い方で答えられないか。3Bの完了条件に対応する。"

[[scenario.memories]]
key = "old-coffee"
kind = "about_person"
content = "開発者はコーヒーが好きだと言っていた（後に紅茶へ訂正済み）"
certainty = "inference"
keywords = "コーヒー 好み 飲み物"

[[scenario.memories]]
key = "new-tea"
kind = "about_person"
content = "開発者は最近は紅茶が好きだと言っている"
certainty = "fact"
keywords = "紅茶 好み 飲み物 最近"

[[scenario.turns]]
text = "私の好きな飲み物、覚えてる？"
expect_memories = ["new-tea"]
expect_any = ["紅茶"]
human_check = "紅茶を現在の好みとして答えているか。コーヒーを現在の事実として断定していないか"
