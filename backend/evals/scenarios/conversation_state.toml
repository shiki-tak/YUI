# 会話理解と修復（計画 docs/plan/v0.2.md §7）。1〜4・6・8・19 は PR2 が必須に
# する規則だけのシナリオ。5・7・9〜18・20〜23 は PR3 が追加した、解釈（LLM）
# が要るシナリオ（`--conversation-state-llm` を付けないと解釈が起きない）。
# シナリオ24は実モデルでは再現できないため pytest 側で確認する。

[[scenario]]
id = "closing-sleep-ends-without-new-question"
aspect = "conversation_state"
description = "終了の合図1：「そろそろ寝るね」の後、新しい質問を出さず短く締めるか。"

[[scenario.steps]]
kind = "say"
text = "今日は楽しかった。そろそろ寝るね"
expect_no_new_question = true
human_check = "短い言葉で締めくくっているか。話を引き延ばしていないか"

[[scenario]]
id = "closing-today-is-enough-ends-without-new-question"
aspect = "conversation_state"
description = "終了の合図2：「今日はここまでにしよう」の後、新しい質問を出さず短く締めるか。"

[[scenario.steps]]
kind = "say"
text = "今日はここまでにしよう"
expect_no_new_question = true
human_check = "短い言葉で締めくくっているか。話を引き延ばしていないか"

[[scenario]]
id = "closing-going-home-ends-without-new-question"
aspect = "conversation_state"
description = "終了の合図3：「そろそろ帰るね」の後、新しい質問を出さず短く締めるか。"

[[scenario.steps]]
kind = "say"
text = "そろそろ帰るね"
expect_no_new_question = true
human_check = "短い言葉で締めくくっているか。話を引き延ばしていないか"

[[scenario]]
id = "closing-and-request-arrive-together"
aspect = "conversation_state"
description = """終了の合図と最後の依頼が同時に来る形（計画 §7 シナリオ4）。
「〜前に」＋終了語で closing、依頼形で question_to_yui を拾い、依頼に答えつつ
新しい質問は出さないか。closing はこのターンでは open のまま残る。"""

[[scenario.steps]]
kind = "say"
text = "寝る前に明日の集合時間だけ教えて"
expect_no_new_question = true
human_check = "集合時間の依頼に答えているか。答え以外の新しい質問を出していないか"

[scenario.steps.expect_conversation_states]
closing = [{ status = "open" }]
question_to_yui = [{ status = "open", contains = ["集合時間"] }]

[[scenario]]
id = "deferred-topic-is-not-brought-up-by-yui"
aspect = "conversation_state"
description = """「映画の話は後で」の後に別の話題を2ターン挟んでも、YUI から
映画の話を持ち出さないか（計画 §7 シナリオ6）。語の一致は記録のみで、
持ち出したかどうかは人手で読む。"""

[[scenario.steps]]
kind = "say"
text = "あ、映画の話はまた今度にしよう"

[scenario.steps.expect_conversation_states]
deferral = [{ status = "open", contains = ["映画"] }]

[[scenario.steps]]
kind = "say"
text = "それより最近、近所に新しいパン屋ができたんだ"
human_check = "映画の話を自分から持ち出していないか"

[[scenario.steps]]
kind = "say"
text = "クロワッサンがすごく美味しかった"
human_check = "映画の話を自分から持ち出していないか"

[[scenario]]
id = "future-suggestion-is-not-a-deferral"
aspect = "conversation_state"
description = """「今度は映画の話をしよう」は未来の提案であって延期ではない
（計画 §7 シナリオ8、誤検出の側）。"""

[[scenario.steps]]
kind = "say"
text = "今度は映画の話をしよう"

[scenario.steps.expect_conversation_states]
deferral = []

[[scenario]]
id = "reported-farewell-is-not-a-closing"
aspect = "conversation_state"
description = """「友達に『またね』と言った」は伝聞であって、話者自身の終了の
合図ではない（計画 §7 シナリオ8、誤検出の側）。"""

[[scenario.steps]]
kind = "say"
text = "さっき友達に「またね」と言って別れたんだ"

[scenario.steps.expect_conversation_states]
closing = []

[[scenario]]
id = "does-not-repeat-unsolicited-explanation"
aspect = "conversation_state"
description = "求められていないのに、同じ説明をそのまま繰り返していないか（計画 §7 シナリオ19前段）。"

[[scenario.memories]]
key = "camera"
kind = "about_person"
content = "開発者は写真を撮るのが好きで、休みの日はカメラを持って出かける"
certainty = "fact"
keywords = "写真 カメラ 趣味 休み"

[[scenario.steps]]
kind = "say"
text = "私の趣味、覚えてる？"
expect_memories = ["camera"]
expect_any = ["写真"]

[[scenario.steps]]
kind = "say"
text = "そういえば最近仕事が忙しくてさ"
expect_not_repeating = true
human_check = "頼まれていない趣味の説明をもう一度そのまま返していないか"

[[scenario]]
id = "re-explains-when-asked-again"
aspect = "conversation_state"
description = "再説明を求められたときは、言い換えて説明し直すか（計画 §7 シナリオ19後段）。"

[[scenario.memories]]
key = "trip"
kind = "experience"
content = "先週、開発者と近所の川沿いを散歩した"
certainty = "fact"
keywords = "散歩 川 週末"

[[scenario.steps]]
kind = "say"
text = "先週何して過ごしたか覚えてる？"
expect_memories = ["trip"]
expect_any = ["散歩"]

[[scenario.steps]]
kind = "say"
text = "ごめん、もう一回説明してくれる？"
human_check = "同じ言い回しの丸写しではなく、言い換えて説明し直しているか"


# --- v0.2 PR3：解釈（LLM）が要る種類（計画 §7 シナリオ 5・7・9〜18・20〜23） ---
# `--conversation-state-llm` を付けて流さないと解釈が起きず、機械判定は
# 「行が無い」側にしか通らない（request/correction/discrepancy/confirmed は
# 解釈でしか作られない。計画 3節）。シナリオ24（解釈の1回失敗をモックする）
# は実モデルでは再現できないため pytest 側で確認する
# （tests/test_interpretation.py の該当テスト）。

[[scenario]]
id = "closing-reopened-when-partner-continues"
aspect = "conversation_state"
description = "終了の合図の後、相手が明示的に続けたら closing が reopened になり、通常どおり応じるか（計画 §7 シナリオ5）。"

[[scenario.steps]]
kind = "say"
text = "そろそろ寝るね"

[[scenario.steps]]
kind = "say"
text = "あ、やっぱりもう少し話したいことがあった"
human_check = "終了した雰囲気のまま素っ気なく返していないか。普通に話を続けているか"

[scenario.steps.expect_conversation_states]
closing = [{ status = "withdrawn", withdraw_reason = "reopened" }]

[[scenario]]
id = "deferral-reopened-when-topic-is-resumed"
aspect = "conversation_state"
description = "延期した話題を相手が明示的に再開したら deferral が reopened になるか（計画 §7 シナリオ7）。"

[[scenario.steps]]
kind = "say"
text = "映画の話はまた今度にしよう"

[[scenario.steps]]
kind = "say"
text = "やっぱり今、映画の話をしてもいい？"
human_check = "延期した話題に、普通に応じているか"

[scenario.steps.expect_conversation_states]
deferral = [{ status = "withdrawn", withdraw_reason = "reopened" }]

[[scenario]]
id = "question-answered-then-resolved-a"
aspect = "conversation_state"
description = "相手の質問に答えた後、次の say で resolved になるか（計画 §7 シナリオ9）。"

[[scenario.steps]]
kind = "say"
text = "好きな食べ物ってある？"
human_check = "質問にきちんと答えているか"

[[scenario.steps]]
kind = "say"
text = "そうなんだ"

[scenario.steps.expect_conversation_states]
question_to_yui = [{ status = "resolved" }]

[[scenario]]
id = "question-answered-then-resolved-b"
aspect = "conversation_state"
description = "相手の質問に答えた後、次の say で resolved になるか（計画 §7 シナリオ10。別の質問文で確認）。"

[[scenario.steps]]
kind = "say"
text = "週末って何か予定ある？"
human_check = "質問にきちんと答えているか"

[[scenario.steps]]
kind = "say"
text = "了解"

[scenario.steps.expect_conversation_states]
question_to_yui = [{ status = "resolved" }]

[[scenario]]
id = "missed-answer-gets-followup-then-resolved"
aspect = "conversation_state"
description = """相手の質問にYUIが答え損ねたら followup_needed になり、
次の返答で答えれば resolved になって followup_needed が下りるか
（計画 §7 シナリオ11）。YUIの返答は実モデルに任せるため、答え損ねるかは
確定しない。答え損ねなければ1つ目の say で resolved になってよい。
集合場所は記憶として投入しておく。投入しないと YUI は「知らない」としか
答えられず、答え損ねの判定ではなく前提の欠落を測ることになる（ISSUE-045）。
質問は**文末**に置く。規則（`detect_request_question`）は文末しか見ないため、
「〜どこだっけ？ あと疲れたよ」の形だと `question_to_yui` 自体が作られず、
解釈にも質問を作る欄が無い（ISSUE-046）。気を逸らす「疲れた」は前に置く。"""

[[scenario.memories]]
key = "meeting-place"
kind = "promise"
content = "明日の集合場所は駅前の噴水の前"
certainty = "fact"
keywords = "明日 集合場所 駅前 噴水 待ち合わせ"

[[scenario.steps]]
kind = "say"
text = "今日すごく疲れたよ。あと、明日の集合場所ってどこだっけ？"
human_check = "集合場所の質問に答えているか。答えていなければ、次のやり取りで答え直すか"

[[scenario.steps]]
kind = "say"
text = "そうなんだ、お疲れさま"
human_check = "前の質問への答えが必要なら、ここで答えているか"

[[scenario.steps]]
kind = "say"
text = "ありがとう"

[scenario.steps.expect_conversation_states]
question_to_yui = [{ status = "resolved", followup_needed = false }]

[[scenario]]
id = "yui-question-clarified-then-answered"
aspect = "conversation_state"
description = """YUIの質問に相手が聞き返し、その後で答えたら、聞き返しの後は
open のまま responded が入り、答えた後の say で resolved になるか
（計画 §7 シナリオ12）。YUI がどんな質問をするかは実モデルに任せる。"""

[[scenario.steps]]
kind = "say"
text = "最近、何か新しいことに挑戦した？"
human_check = "相手に何か質問を返しているか"

[[scenario.steps]]
kind = "say"
text = "え、何のこと？"
human_check = "聞き返しに答え直しているか"

[[scenario.steps]]
kind = "say"
text = "ああ、なるほどね。実は最近ジョギングを始めたよ"

[[scenario]]
id = "explicit-correction-is-adopted-without-confirmation"
aspect = "conversation_state"
description = "明示的な訂正は確認せずに correction を作り、以後は訂正後の内容で扱うか（計画 §7 シナリオ13）。"

[[scenario.steps]]
kind = "say"
text = "土曜に映画に行くよ"

[[scenario.steps]]
kind = "say"
text = "ごめん、土曜じゃなくて日曜だった"
human_check = "訂正をそのまま受け止めているか。「本当に日曜ですか？」のように確認し直していないか"

[scenario.steps.expect_conversation_states]
correction = [{ status = "open", contains = ["日曜"] }]
discrepancy = []

[[scenario.steps]]
kind = "say"
text = "映画、何時からだっけ？"
expect_any = ["日曜"]
expect_none = ["土曜"]
human_check = "日曜の予定として答えているか。土曜のままにしていないか"

[[scenario]]
id = "correction-does-not-trigger-reconfirmation"
aspect = "conversation_state"
description = "訂正した後、同じ古い情報が話題に出ても再確認しない・discrepancy を作らないか（計画 §7 シナリオ14）。"

[[scenario.memories]]
key = "old-plan"
kind = "experience"
content = "開発者は土曜に映画に行く予定だと話していた"
certainty = "fact"
keywords = "映画 土曜 予定"

[[scenario.steps]]
kind = "say"
text = "そういえば土曜の映画の予定、覚えてる？"
expect_memories = ["old-plan"]

[[scenario.steps]]
kind = "say"
text = "ごめん、土曜じゃなくて日曜だった"

[[scenario.steps]]
kind = "say"
text = "映画、楽しみだな"
human_check = "土曜だったことを蒸し返して確認し直していないか"

[scenario.steps.expect_conversation_states]
discrepancy = []

[[scenario]]
id = "ambiguous-discrepancy-is-confirmed-once"
aspect = "conversation_state"
description = """訂正かどうか不明な食い違いは、断定せず1回だけ確かめるか
（計画 §7 シナリオ15）。asked は確認を発話した直後ではなく、次の相手の
発言を解釈した後の say で確かめる。"""

[[scenario.memories]]
key = "plan"
kind = "experience"
content = "開発者は土曜に映画に行く予定だと話していた"
certainty = "fact"
keywords = "映画 土曜 予定"

[[scenario.steps]]
kind = "say"
text = "そういえば映画の予定、覚えてる？"
expect_memories = ["plan"]

[[scenario.steps]]
kind = "say"
text = "あの映画、日曜の回がすごく混みそうだね"
human_check = """土曜と聞いていたのに日曜と言われて、断定せず確かめているか
（「土曜ではなかったですか？」等）。相手を疑うような言い方になっていないか"""

[[scenario.steps]]
kind = "say"
text = "ああ、うん、日曜で合ってるよ"

[scenario.steps.expect_conversation_states]
