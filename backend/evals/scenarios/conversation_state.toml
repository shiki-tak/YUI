aspect = "conversation_state"
description = "AへのYUIの質問は、Bが発言しても responded も resolved も入らないか（計画 §7 シナリオ20。PR1のpytestと対になる評価器側の確認）。"

[[scenario.speakers]]
key = "a"
external_id = "eval-pr3-a"
display_name = "Aさん"

[[scenario.speakers]]
key = "b"
external_id = "eval-pr3-b"
display_name = "Bさん"

[[scenario.steps]]
