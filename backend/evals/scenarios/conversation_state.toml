[[scenario]]
id = "unclear-confirmation-response-stays-open"
aspect = "conversation_state"
description = "確認への返答が不明確なら、discrepancy は responded が入ったまま open にとどまり、再質問しないか（計画 §7 シナリオ16）。"

[[scenario.memories]]
key = "plan"
kind = "experience"
content = "開発者は土曜に映画に行く予定だと話していた"
certainty = "fact"
keywords = "映画 土曜 予定"

[[scenario.steps]]
kind = "say"
text = "そういえば映画の予定、覚えてる？"
expect_memories = ["plan"]

[[scenario.steps]]
kind = "say"
text = "あの映画、日曜の回がすごく混みそうだね"

[[scenario.steps]]
kind = "say"
text = "さあ、どうだったかな"

[[scenario.steps]]
