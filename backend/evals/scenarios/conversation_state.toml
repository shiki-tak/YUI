[[scenario]]
id = "no-discrepancy-in-a-plain-conversation"
aspect = "conversation_state"
description = "食い違いの無い会話を5ターン続けても discrepancy を作らないか（計画 §7 シナリオ17。過剰確認の側）。"

[[scenario.steps]]
kind = "say"
text = "最近、近所に新しいパン屋ができたんだ"

[[scenario.steps]]
