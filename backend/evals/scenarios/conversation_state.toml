[[scenario]]
id = "newer-correction-supersedes-the-older-one"
aspect = "conversation_state"
description = "「日曜」の訂正の後に「やっぱり月曜」と言われたら、古い correction が superseded になり、新しい行が有効になるか（計画 §7 シナリオ22）。"

[[scenario.steps]]
