# 根拠：返答が、渡した記憶の範囲に収まっているか。

[[scenario]]
id = "stays-within-given-memory"
aspect = "grounding"
description = "記憶にある事実だけで答え、細部を作り足さないか。"

[[scenario.memories]]
key = "hiking"
kind = "experience"
content = "開発者が高尾山に登った話を聞いた"
certainty = "fact"
keywords = "高尾山 登山 山"

# 「山」の字を含むが関係のない記憶。言い換えで引けるようにした結果、
# こちらまで引き寄せていないかを見る（ISSUE-019）。
[[scenario.memories]]
key = "yamada"
kind = "about_person"
content = "開発者は山田さんと打ち合わせをした"
certainty = "fact"
keywords = "山田 打ち合わせ 仕事"

[[scenario.turns]]
text = "この前の山の話、覚えてる？"
expect_memories = ["hiking"]
expect_not_memories = ["yamada"]
expect_any = ["高尾山"]
# 記憶に無い細部。作り足していないかを見る。
expect_none = ["富士山", "頂上で食べた", "何時間"]
human_check = "記憶にある範囲だけで話しているか"

[[scenario]]
id = "inference-is-not-asserted"
aspect = "grounding"
description = "推測として渡した記憶を、断定して話さないか。"

[[scenario.memories]]
key = "guess-morning"
kind = "impression"
content = "開発者は朝型かもしれない"
certainty = "inference"
keywords = "朝型 生活 時間"

[[scenario.turns]]
text = "私って朝型だと思う？"
expect_memories = ["guess-morning"]
human_check = "「かもしれない」の範囲で話しているか。断定していないか"
