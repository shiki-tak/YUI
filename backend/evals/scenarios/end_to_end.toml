# 完了条件1・2を、記憶が作られるところから通して見る。
#
# 他のシナリオは記憶を事前に入れており、抽出と採用の経路を通っていない。
# ここでは会話 → 振り返り → 採用 → 再起動 → 別の会話、という順で流す。
# レビューで5回続けて「この通し評価が無い」と指摘された部分にあたる。

[[scenario]]
id = "promise-survives-a-restart"
aspect = "memory"
description = """完了条件1：複数セッションと再起動をまたいで、約束を参照できるか。
記憶を事前に入れず、会話から抽出して採用したものが、接続を作り直した後の
別の会話で使われるかを見る。"""

[[scenario.steps]]
kind = "say"
text = "写真を撮るのが好きなんだ。休みの日はカメラを持って歩いてる"

[[scenario.steps]]
kind = "say"
text = "次は山で撮った写真の話をしよう"
human_check = "約束を受け止めているか"

# 振り返って、出た候補を採用する。ここが従来の評価では通っていなかった。
[[scenario.steps]]
kind = "reflect"
accept = true
accept_key = "約束"
expect_kinds = ["promise"]
expect_candidate_any = ["写真", "山"]
human_check = "約束が、後で引ける形の本文になっているか"

# 接続を作り直す。プロセスの再起動に近い状態にする。
[[scenario.steps]]
kind = "restart"

[[scenario.steps]]
kind = "say"
text = "前に何を話す約束をしたっけ？"
# 採用した約束が実際に渡ったことまで見る。返答の単語だけでは、
# 記憶を使わずに言い当てた回と区別できない（第7回レビュー）。
expect_memories = ["約束"]
expect_any = ["写真", "山"]
human_check = "採用した約束を踏まえて答えているか。作り話を足していないか"

[[scenario]]
id = "correction-changes-the-next-answer"
aspect = "memory"
description = """完了条件2：訂正した後、古い情報を現在の事実として答えないか。
記憶を事前に入れず、会話から作った記憶を実際に訂正してから、次の会話で
好みを尋ねる。設計書の確認シナリオ（コーヒー → 紅茶）にあたる。"""

[[scenario.steps]]
kind = "say"
text = "私、コーヒーが好きでね。朝は必ず淹れてるんだ"

[[scenario.steps]]
kind = "reflect"
accept = true
# 「コーヒー」だけで絞ると、同じ会話から「コーヒーが好き」（about_person）と
# 「コーヒーの香り／飲むこと」への印象（impression）の2件が抽出されたとき、
# どちらも「コーヒー」を含むため下の correct_memory の対象が一意に決まらない
# （ISSUE-035）。accept_limit = 1 は「先頭から1件採用する」のではなく、
# 「一致する候補がちょうど1件でなければ手順を失敗として記録する」——
# どちらの候補が先に来るかは抽出結果の順序次第で、シナリオからは決められない
# ため（第3回レビュー指摘）、件数が想定と違えば黙って採用せず、評価の
# 失敗として見えるようにする。
accept_contains = ["コーヒー"]
accept_limit = 1
expect_candidate_any = ["コーヒー"]

[[scenario.steps]]
kind = "new_conversation"

# 開発者が記憶を訂正する。会話で言い直すのではなく、訂正の操作を通す。
[[scenario.steps]]
kind = "correct_memory"
match = "コーヒー"
content = "開発者は最近は紅茶が好き"

[[scenario.steps]]
kind = "restart"

[[scenario.steps]]
kind = "say"
text = "私の好きな飲み物、覚えてる？"
expect_any = ["紅茶"]
expect_none = ["コーヒーがお好き", "コーヒーが好きだと"]
human_check = "紅茶を現在の好みとして答えているか。コーヒーを現在の事実として断定していないか"

[[scenario]]
id = "correction-withdraws-the-state-it-came-from"
aspect = "memory"
description = """完了条件2の、状態まで届くかを見る。記憶を訂正すると、そこから
作った関心・関係性へ再評価の印が付き、次の会話へ渡らなくなるか。
第6回レビューの「自動抽出した状態も採用してから訂正する評価が無い」にあたる。"""

[[scenario.steps]]
kind = "say"
text = "最近ずっと天体観測にはまっててね。望遠鏡を買って毎晩ベランダで星を見てるんだ"

[[scenario.steps]]
kind = "say"
text = "土星の輪が見えたときは震えたよ。YUIも興味ある？"
human_check = "相手の話に乗りつつ、体験したことにしていないか"

# 記憶と、そこから生まれた関心・関係性の両方を採用する。
[[scenario.steps]]
kind = "reflect"
accept = true
accept_states = true
accept_key = "天体観測"
# 「望遠鏡を買った」という体験そのものを訂正したいので、その語を含む候補に
# 絞る。ただし語を絞るだけでは、同じ会話から似た候補が複数抽出されたとき
# また曖昧になりうる（ISSUE-035、コーヒーのシナリオと同じ理由）。
# accept_limit = 1 は「一致がちょうど1件でなければ手順を失敗として記録する」
# ガードであり、複数件・0件のどちらも黙って採用しない（第3回レビュー指摘）。
accept_contains = ["望遠鏡"]
accept_limit = 1
expect_candidate_any = ["天体観測", "望遠鏡", "星"]
expect_state_any = ["天体", "星", "望遠鏡", "宇宙"]
human_check = "関心が、開発者の話を写しただけでなくYUI自身のものとして書かれているか"

[[scenario.steps]]
kind = "new_conversation"

# 採用した記憶と状態が、実際に会話へ渡ることを先に確かめる。
# ここが渡っていなければ、後の「渡らない」は空振りになる。
[[scenario.steps]]
kind = "say"
text = "この前話した天体観測のこと、覚えてる？"
expect_memories = ["天体観測"]
expect_states = ["星"]

# 開発者が記憶を訂正する。根拠が変わったので、そこから作った状態は
# 再評価の印が付き、会話へ渡らなくなるはず。
# 「天体観測」だけで絞ると、この会話からは複数の記憶（体験そのものと、
# YUI 自身の関心についての候補）が採用され、どちらも「天体観測」を含む
# ことがあるため対象が一意に決まらない（ISSUE-035）。訂正したいのは
# 「望遠鏡を買った」という体験そのものなので、その語まで絞る。
[[scenario.steps]]
kind = "correct_memory"
match = "望遠鏡"
content = "開発者は天体観測をやめて、いまは何にもはまっていない"

[[scenario.steps]]
kind = "restart"

[[scenario.steps]]
kind = "say"
text = "いま私が何にはまってるか知ってる？"
expect_not_states = ["星", "天体", "望遠鏡", "宇宙"]
human_check = "訂正後の内容で答えているか。古い関心を現在のものとして話していないか"
